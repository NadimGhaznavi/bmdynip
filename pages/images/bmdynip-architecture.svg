<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">BMDynIP system architecture</title><desc id="desc">Local workstation and Linux server behind a router. Cron and the Web UI start the updater. MariaDB stores hostnames, status and history. External IP checks and GoDaddy DNS are reached through the router.</desc>
